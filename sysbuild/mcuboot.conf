#############################################
# MCUboot Bootloader Configuration
# USB Serial Recovery + External Flash Support
# Boot partition: 136 KB (0x22000) - Arduino BL 64K + MCUboot 72K
#############################################

# ---------- Size Optimization ----------
# Aggressive size reduction to fit USB CDC + SPI NOR in 128 KB
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_COMPILER_OPT="-Os -ffunction-sections -fdata-sections"

# ---------- Serial Recovery (USB CDC ACM) ----------
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y

# Enter serial recovery only on double-tap of the reset button.
# WAIT_FOR_DFU traps MCUboot when USB is connected; ENTRANCE_GPIO needs
# a dedicated button.  PIN_RESET checks the nRF reset-reason register.
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=n
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_PIN_RESET=y

# ---------- Image Management ----------
CONFIG_BOOT_SWAP_USING_SCRATCH=y

# ---------- External Flash Support ----------
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Flash operations
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# ---------- Logging (minimal) ----------
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# ---------- USB Stack for Recovery ----------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0100
CONFIG_USB_DEVICE_LOG_LEVEL_OFF=y
CONFIG_USB_DRIVER_LOG_LEVEL_OFF=y
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y

# ---------- Multithreading ----------
CONFIG_MULTITHREADING=y

# ---------- Strip unused features ----------
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_TIMESLICING=n
CONFIG_ERRNO=y
CONFIG_CBPRINTF_NANO=y
CONFIG_BOOT_MAX_IMG_SECTORS=256
