#############################################
# MCUboot Bootloader Configuration
# USB Serial Recovery + External Flash Support
# Boot partition: 136 KB (0x22000) - Arduino BL 64K + MCUboot 72K
#############################################

# ---------- Size Optimization ----------
# Aggressive size reduction to fit USB CDC + SPI NOR in 128 KB
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_COMPILER_OPT="-Os -ffunction-sections -fdata-sections"

# ---------- Serial Recovery (UART0 + boot-mode retention) ----------
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_CDC_ACM=n

# Enter serial recovery from application via Zephyr retention boot mode
# (bootmode_set(BOOT_MODE_TYPE_BOOTLOADER) + reboot).
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=n
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_PIN_RESET=n
CONFIG_BOOT_SERIAL_BOOT_MODE=y

# ---------- Retention Boot Mode (nRF GPREGRET) ----------
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# ---------- Image Management ----------
# SCRATCH mode is set at sysbuild level (SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH)
CONFIG_BOOT_SWAP_USING_SCRATCH=y

# ---------- External Flash Support ----------
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Flash operations
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# ---------- Logging (minimal) ----------
CONFIG_LOG=y
CONFIG_BOOT_BANNER=y
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y
CONFIG_MCUBOOT_UTIL_LOG_LEVEL_DBG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# ---------- USB Stack for Recovery ----------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0100
CONFIG_USB_DEVICE_LOG_LEVEL_OFF=y
CONFIG_USB_DRIVER_LOG_LEVEL_OFF=y
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y

# ---------- Multithreading ----------
CONFIG_MULTITHREADING=y

# ---------- Strip unused features ----------
# Signature type is managed by sysbuild (RSA-2048 via SB_CONFIG_BOOT_SIGNATURE_KEY_FILE)
CONFIG_TIMESLICING=n
CONFIG_ERRNO=y
CONFIG_CBPRINTF_NANO=y
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=512
