#############################################
# Sysbuild Configuration for AutoWatering
# Enables MCUboot bootloader with sysbuild
#############################################

# Enable MCUboot as bootloader
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Use scratch-based swap (not offset) – required for cross-device swap
# (slot0 on internal flash, slot1 on external SPI W25Q128)
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
